name: Flutter CI

on:
  push:
  pull_request:
    branches: [main, master, architecture/v2-foundation]
  workflow_dispatch:
    inputs:
      gate:
        description: Verification gate
        type: choice
        options: [fast, full, release]
        default: fast

permissions:
  contents: read

concurrency:
  group: flutter-${{ github.workflow }}-${{ github.ref }}-${{ inputs.gate || 'automatic' }}
  cancel-in-progress: true

jobs:
  fast:
    if: (github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/cleanup/')) || inputs.gate == 'fast'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Focused architecture tests
        run: flutter test test/core/spatial test/features/farm
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Diff whitespace check
        run: git diff --check HEAD^ HEAD

  full:
    timeout-minutes: 30
    if: github.event_name == 'pull_request' || inputs.gate == 'full' || inputs.gate == 'release' || (github.event_name == 'push' && (startsWith(github.ref, 'refs/heads/cleanup/') || github.ref == 'refs/heads/fix/cmd041-finance-integration'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: SQLite native test dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev
          # Use the SQLite library verified by Ubuntu's signed APT repository
          # only in Linux test jobs. Android keeps the pinned native assets.
          cat >> pubspec.yaml <<'YAML'

          hooks:
            user_defines:
              sqlite3:
                source: system
          YAML
      - name: Accepted field cleanup regression
        run: flutter test test/providers test/screens test/field_restore_provider_test.dart --reporter expanded
      - name: Sandbox salary posting regression
        if: github.ref == 'refs/heads/fix/cmd041-finance-integration'
        run: flutter test test/features/integration/integrated_ledgers_test.dart --plain-name 'salary posting rejects future date and does not consume records'
      - name: Finance repository transaction regression
        if: github.ref == 'refs/heads/fix/cmd041-finance-integration'
        run: flutter test test/features/finance/data/local/sqlite_finance_document_repository_test.dart
      - name: Full regression
        run: flutter test
      - name: Diff whitespace check
        run: git diff --check HEAD^ HEAD

  release:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/fix/cmd041-finance-integration') || inputs.gate == 'release' || ((github.event_name == 'push' || github.event_name == 'pull_request') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.base_ref == 'main' || github.base_ref == 'master'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          test -n "$GOOGLE_SERVICES_JSON"
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
      - run: flutter pub get
      # Build the supported 64-bit Android target explicitly. The sqlite3 3.5.2
      # native-assets hook currently rejects its downloaded 32-bit ARM binary
      # because the SHA-256 differs from the package's pinned checksum.
      # Do not disable checksum verification or accept that binary.
      - run: flutter build apk --debug --target-platform android-arm64
      - name: Generate and verify APK checksum
        working-directory: build/app/outputs/flutter-apk
        run: |
          test -s app-debug.apk
          sha256sum app-debug.apk > app-debug.apk.sha256
          sha256sum --check app-debug.apk.sha256
          cat app-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: agrico-debug-apk
          if-no-files-found: error
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/app-debug.apk.sha256
      - name: Remove Firebase config
        if: always()
        run: rm -f android/app/google-services.json
